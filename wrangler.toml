name = "blog-site"
compatibility_date = "2026-07-22"
pages_build_output_dir = "dist"

# Legacy Workers AI binding (other features / fallback). Ask AI uses ASK_SEARCH.
[ai]
binding = "AI"
remote = true

# Cloudflare AI Search instance binding for Ask AI (chatCompletions).
[[ai_search]]
binding = "ASK_SEARCH"
instance_name = "stevenjhu-ai-search"
remote = true
