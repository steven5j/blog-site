<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 740" role="img" aria-label="單體式架構、微型服務架構與模組化單體架構對比圖">
  <!-- Background -->
  <rect width="1600" height="740" fill="#f4f4f4"/>

  <!-- Legend / Header indicators -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">
    <rect x="70" y="32" width="22" height="12" rx="3" fill="#c13b3b"/>
    <text x="100" y="43" font-size="14" font-weight="600" fill="#2a2a2a">獨立部署單元 / 核心服務</text>

    <rect x="320" y="32" width="22" height="12" rx="3" fill="#2a2a2a"/>
    <text x="350" y="43" font-size="14" font-weight="600" fill="#2a2a2a">內部模組 / 邊界隔離</text>

    <rect x="560" y="32" width="22" height="12" rx="3" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
    <text x="590" y="43" font-size="14" font-weight="600" fill="#2a2a2a">資料庫實體 (Database)</text>

    <line x1="810" y1="38" x2="845" y2="38" stroke="#c13b3b" stroke-width="2.5" stroke-dasharray="4,4"/>
    <text x="855" y="43" font-size="14" font-weight="600" fill="#c13b3b">跨網 RPC / HTTP / 事件通訊</text>
  </g>

  <!-- ========================================== -->
  <!-- Left Column: Monolithic Architecture       -->
  <!-- ========================================== -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">
    <!-- Category Title -->
    <text x="70" y="92" font-size="20" font-weight="800" fill="#c13b3b" letter-spacing="0.04em">單體式架構 (MONOLITH)</text>
    <text x="70" y="115" font-size="13" fill="#6b6b6b">單一程式碼庫 · 進程內直接呼叫 · 共享單一資料庫</text>

    <!-- Main Container Box -->
    <rect x="70" y="135" width="420" height="310" rx="12" fill="#ffffff" stroke="#2a2a2a" stroke-width="3"/>
    <rect x="70" y="135" width="420" height="42" rx="12" fill="#2a2a2a"/>
    <rect x="70" y="165" width="420" height="12" fill="#2a2a2a"/>
    <text x="280" y="162" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">單一部署單元 (Monolithic App)</text>

    <!-- Internal Modules Stack -->
    <g transform="translate(95, 190)">
      <rect x="0" y="0" width="370" height="46" rx="6" fill="#f8f9fa" stroke="#e5e5e5" stroke-width="1.5"/>
      <rect x="12" y="13" width="8" height="20" rx="2" fill="#c13b3b"/>
      <text x="30" y="29" font-size="13.5" font-weight="700" fill="#2a2a2a">會員與權限模組 (Auth &amp; Users)</text>

      <rect x="0" y="55" width="370" height="46" rx="6" fill="#f8f9fa" stroke="#e5e5e5" stroke-width="1.5"/>
      <rect x="12" y="68" width="8" height="20" rx="2" fill="#c13b3b"/>
      <text x="30" y="84" font-size="13.5" font-weight="700" fill="#2a2a2a">訂單與帳務模組 (Orders &amp; Billing)</text>

      <rect x="0" y="110" width="370" height="46" rx="6" fill="#f8f9fa" stroke="#e5e5e5" stroke-width="1.5"/>
      <rect x="12" y="123" width="8" height="20" rx="2" fill="#c13b3b"/>
      <text x="30" y="139" font-size="13.5" font-weight="700" fill="#2a2a2a">商品與庫存模組 (Catalog &amp; Stock)</text>

      <rect x="0" y="165" width="370" height="46" rx="6" fill="#f8f9fa" stroke="#e5e5e5" stroke-width="1.5"/>
      <rect x="12" y="178" width="8" height="20" rx="2" fill="#c13b3b"/>
      <text x="30" y="194" font-size="13.5" font-weight="700" fill="#2a2a2a">通知與報表模組 (Notify &amp; Reports)</text>
    </g>

    <!-- Downward connection arrow -->
    <line x1="280" y1="445" x2="280" y2="500" stroke="#2a2a2a" stroke-width="2.5"/>
    <polygon points="274,490 280,502 286,490" fill="#2a2a2a"/>

    <!-- Shared DB Cylinder (Center at 280, width 220, height 95) -->
    <g transform="translate(170, 505)">
      <!-- Cylinder Body -->
      <path d="M 0,16 L 0,80 A 110,16 0 0,0 220,80 L 220,16 A 110,16 0 0,1 0,16 Z" fill="#ffffff" stroke="#4a4a4a" stroke-width="2.5"/>
      <!-- Disk Ridges -->
      <path d="M 0,38 A 110,16 0 0,0 220,38" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="3,2"/>
      <path d="M 0,59 A 110,16 0 0,0 220,59" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- Top Cap Ellipse -->
      <ellipse cx="110" cy="16" rx="110" ry="16" fill="#e8eaed" stroke="#4a4a4a" stroke-width="2.5"/>
      <text x="110" y="52" font-size="14.5" font-weight="800" fill="#2a2a2a" text-anchor="middle">單一共享資料庫</text>
    </g>

    <!-- Labels below DB -->
    <text x="280" y="630" font-size="15" font-weight="700" fill="#2a2a2a" text-anchor="middle">全站共享關聯資料庫</text>
    <text x="280" y="650" font-size="12" fill="#6b6b6b" text-anchor="middle">原生 ACID 強一致性 · 跨表隨意 JOIN · 單點容量瓶頸</text>
  </g>

  <!-- ========================================== -->
  <!-- Middle Column: Microservices Architecture  -->
  <!-- ========================================== -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">
    <!-- Category Title -->
    <text x="540" y="92" font-size="20" font-weight="800" fill="#c13b3b" letter-spacing="0.04em">微型服務架構 (MICROSERVICES)</text>
    <text x="540" y="115" font-size="13" fill="#6b6b6b">服務獨立自治 · Database-per-service · 分散式網路協作</text>

    <!-- API Gateway Box -->
    <rect x="540" y="135" width="520" height="42" rx="8" fill="#c13b3b"/>
    <text x="800" y="162" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">API Gateway / 訊息代理匯流排 (Event Bus)</text>

    <!-- Downward Network Arrows -->
    <line x1="597" y1="177" x2="597" y2="208" stroke="#c13b3b" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="732" y1="177" x2="732" y2="208" stroke="#c13b3b" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="867" y1="177" x2="867" y2="208" stroke="#c13b3b" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="1002" y1="177" x2="1002" y2="208" stroke="#c13b3b" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Service 1: Auth -->
    <g transform="translate(542, 210)">
      <rect x="0" y="0" width="110" height="150" rx="8" fill="#ffffff" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="28" rx="8" fill="#2a2a2a"/>
      <rect x="0" y="18" width="110" height="10" fill="#2a2a2a"/>
      <text x="55" y="19" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Auth 服務</text>
      <text x="55" y="55" font-size="11" fill="#6b6b6b" text-anchor="middle">獨立容器</text>
      <text x="55" y="75" font-size="11.5" font-weight="700" fill="#c13b3b" text-anchor="middle">Go / Node</text>
      <rect x="12" y="95" width="86" height="22" rx="4" fill="#f0f0f0"/>
      <text x="55" y="110" font-size="10" fill="#2a2a2a" text-anchor="middle">獨立 CI/CD</text>
      <text x="55" y="135" font-size="10" fill="#6b6b6b" text-anchor="middle">端口: 8081</text>
    </g>

    <!-- Service 2: Orders -->
    <g transform="translate(677, 210)">
      <rect x="0" y="0" width="110" height="150" rx="8" fill="#ffffff" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="28" rx="8" fill="#2a2a2a"/>
      <rect x="0" y="18" width="110" height="10" fill="#2a2a2a"/>
      <text x="55" y="19" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Order 服務</text>
      <text x="55" y="55" font-size="11" fill="#6b6b6b" text-anchor="middle">獨立容器</text>
      <text x="55" y="75" font-size="11.5" font-weight="700" fill="#c13b3b" text-anchor="middle">.NET Core</text>
      <rect x="12" y="95" width="86" height="22" rx="4" fill="#f0f0f0"/>
      <text x="55" y="110" font-size="10" fill="#2a2a2a" text-anchor="middle">獨立 CI/CD</text>
      <text x="55" y="135" font-size="10" fill="#6b6b6b" text-anchor="middle">端口: 8082</text>
    </g>

    <!-- Service 3: Stock -->
    <g transform="translate(812, 210)">
      <rect x="0" y="0" width="110" height="150" rx="8" fill="#ffffff" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="28" rx="8" fill="#2a2a2a"/>
      <rect x="0" y="18" width="110" height="10" fill="#2a2a2a"/>
      <text x="55" y="19" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stock 服務</text>
      <text x="55" y="55" font-size="11" fill="#6b6b6b" text-anchor="middle">獨立容器</text>
      <text x="55" y="75" font-size="11.5" font-weight="700" fill="#c13b3b" text-anchor="middle">Java Spring</text>
      <rect x="12" y="95" width="86" height="22" rx="4" fill="#f0f0f0"/>
      <text x="55" y="110" font-size="10" fill="#2a2a2a" text-anchor="middle">獨立 CI/CD</text>
      <text x="55" y="135" font-size="10" fill="#6b6b6b" text-anchor="middle">端口: 8083</text>
    </g>

    <!-- Service 4: Notify -->
    <g transform="translate(947, 210)">
      <rect x="0" y="0" width="110" height="150" rx="8" fill="#ffffff" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="0" y="0" width="110" height="28" rx="8" fill="#2a2a2a"/>
      <rect x="0" y="18" width="110" height="10" fill="#2a2a2a"/>
      <text x="55" y="19" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">Notify 服務</text>
      <text x="55" y="55" font-size="11" fill="#6b6b6b" text-anchor="middle">獨立容器</text>
      <text x="55" y="75" font-size="11.5" font-weight="700" fill="#c13b3b" text-anchor="middle">Python / Rust</text>
      <rect x="12" y="95" width="86" height="22" rx="4" fill="#f0f0f0"/>
      <text x="55" y="110" font-size="10" fill="#2a2a2a" text-anchor="middle">獨立 CI/CD</text>
      <text x="55" y="135" font-size="10" fill="#6b6b6b" text-anchor="middle">端口: 8084</text>
    </g>

    <!-- Cross-service network calls banner -->
    <rect x="540" y="380" width="520" height="65" rx="8" fill="#ffffff" stroke="#c13b3b" stroke-width="1.5"/>
    <text x="800" y="405" font-size="13" font-weight="700" fill="#c13b3b" text-anchor="middle">跨網 RPC / HTTP / 訊息佇列 (Saga 交易 · 延遲 5-50ms)</text>
    <text x="800" y="427" font-size="11.5" fill="#6b6b6b" text-anchor="middle">依賴分散式追蹤 (Distributed Tracing) · 斷路器與防雪崩機制</text>

    <!-- Downward arrows to 4 databases -->
    <line x1="597" y1="445" x2="597" y2="505" stroke="#4a4a4a" stroke-width="2"/>
    <polygon points="593,497 597,506 601,497" fill="#4a4a4a"/>

    <line x1="732" y1="445" x2="732" y2="505" stroke="#4a4a4a" stroke-width="2"/>
    <polygon points="728,497 732,506 736,497" fill="#4a4a4a"/>

    <line x1="867" y1="445" x2="867" y2="505" stroke="#4a4a4a" stroke-width="2"/>
    <polygon points="863,497 867,506 871,497" fill="#4a4a4a"/>

    <line x1="1002" y1="445" x2="1002" y2="505" stroke="#4a4a4a" stroke-width="2"/>
    <polygon points="998,497 1002,506 1006,497" fill="#4a4a4a"/>

    <!-- 4 Individual Database Cylinders (aligned at y=505, width=102, height=95) -->
    <!-- DB 1: Auth DB (center 597 -> x=546) -->
    <g transform="translate(546, 505)">
      <path d="M 0,14 L 0,80 A 51,14 0 0,0 102,80 L 102,14 A 51,14 0 0,1 0,14 Z" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
      <path d="M 0,36 A 51,14 0 0,0 102,36" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <path d="M 0,58 A 51,14 0 0,0 102,58" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <ellipse cx="51" cy="14" rx="51" ry="14" fill="#e8eaed" stroke="#4a4a4a" stroke-width="2"/>
      <text x="51" y="52" font-size="12" font-weight="700" fill="#2a2a2a" text-anchor="middle">Auth DB</text>
    </g>

    <!-- DB 2: Order DB (center 732 -> x=681) -->
    <g transform="translate(681, 505)">
      <path d="M 0,14 L 0,80 A 51,14 0 0,0 102,80 L 102,14 A 51,14 0 0,1 0,14 Z" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
      <path d="M 0,36 A 51,14 0 0,0 102,36" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <path d="M 0,58 A 51,14 0 0,0 102,58" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <ellipse cx="51" cy="14" rx="51" ry="14" fill="#e8eaed" stroke="#4a4a4a" stroke-width="2"/>
      <text x="51" y="52" font-size="12" font-weight="700" fill="#2a2a2a" text-anchor="middle">Order DB</text>
    </g>

    <!-- DB 3: Stock DB (center 867 -> x=816) -->
    <g transform="translate(816, 505)">
      <path d="M 0,14 L 0,80 A 51,14 0 0,0 102,80 L 102,14 A 51,14 0 0,1 0,14 Z" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
      <path d="M 0,36 A 51,14 0 0,0 102,36" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <path d="M 0,58 A 51,14 0 0,0 102,58" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <ellipse cx="51" cy="14" rx="51" ry="14" fill="#e8eaed" stroke="#4a4a4a" stroke-width="2"/>
      <text x="51" y="52" font-size="12" font-weight="700" fill="#2a2a2a" text-anchor="middle">Stock DB</text>
    </g>

    <!-- DB 4: Notify DB (center 1002 -> x=951) -->
    <g transform="translate(951, 505)">
      <path d="M 0,14 L 0,80 A 51,14 0 0,0 102,80 L 102,14 A 51,14 0 0,1 0,14 Z" fill="#ffffff" stroke="#4a4a4a" stroke-width="2"/>
      <path d="M 0,36 A 51,14 0 0,0 102,36" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <path d="M 0,58 A 51,14 0 0,0 102,58" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <ellipse cx="51" cy="14" rx="51" ry="14" fill="#e8eaed" stroke="#4a4a4a" stroke-width="2"/>
      <text x="51" y="52" font-size="12" font-weight="700" fill="#2a2a2a" text-anchor="middle">Notify DB</text>
    </g>

    <!-- Labels below DBs -->
    <text x="800" y="630" font-size="15" font-weight="700" fill="#2a2a2a" text-anchor="middle">專屬獨立資料庫 (Database-per-service)</text>
    <text x="800" y="650" font-size="12" fill="#6b6b6b" text-anchor="middle">嚴禁跨庫直查 · 依賴最終一致性 · 各自技術選型與個別擴充</text>
  </g>

  <!-- ========================================== -->
  <!-- Right Column: Modular Monolith             -->
  <!-- ========================================== -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">
    <!-- Category Title -->
    <text x="1110" y="92" font-size="20" font-weight="800" fill="#c13b3b" letter-spacing="0.04em">模組化單體 (MODULAR MONOLITH)</text>
    <text x="1110" y="115" font-size="13" fill="#6b6b6b">高內聚邊界 · 零網路開銷 · 具備隨時拆分能力</text>

    <!-- Main Container Box -->
    <rect x="1110" y="135" width="420" height="310" rx="12" fill="#ffffff" stroke="#2a2a2a" stroke-width="3"/>
    <rect x="1110" y="135" width="420" height="42" rx="12" fill="#2a2a2a"/>
    <rect x="1110" y="165" width="420" height="12" fill="#2a2a2a"/>
    <text x="1320" y="162" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">單一部署單元 (嚴格介面隔離)</text>

    <!-- Internal Isolated Modules (2x2 grid) -->
    <g transform="translate(1130, 195)">
      <!-- Module 1: Auth -->
      <rect x="0" y="0" width="180" height="98" rx="6" fill="#f8f9fa" stroke="#c13b3b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="90" y="26" font-size="13" font-weight="700" fill="#2a2a2a" text-anchor="middle">會員模組 (Auth)</text>
      <text x="90" y="47" font-size="11" fill="#6b6b6b" text-anchor="middle">私有領域模型</text>
      <text x="90" y="67" font-size="11" font-weight="700" fill="#c13b3b" text-anchor="middle">公開 IAuthService</text>
      <text x="90" y="85" font-size="10" fill="#2a2a2a" text-anchor="middle">內部實作隱藏</text>

      <!-- Module 2: Order -->
      <rect x="200" y="0" width="180" height="98" rx="6" fill="#f8f9fa" stroke="#c13b3b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="290" y="26" font-size="13" font-weight="700" fill="#2a2a2a" text-anchor="middle">訂單模組 (Orders)</text>
      <text x="290" y="47" font-size="11" fill="#6b6b6b" text-anchor="middle">私有業務邏輯</text>
      <text x="290" y="67" font-size="11" font-weight="700" fill="#c13b3b" text-anchor="middle">公開 IOrderService</text>
      <text x="290" y="85" font-size="10" fill="#2a2a2a" text-anchor="middle">嚴禁外部隨意異動</text>

      <!-- Module 3: Stock -->
      <rect x="0" y="112" width="180" height="98" rx="6" fill="#f8f9fa" stroke="#c13b3b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="90" y="138" font-size="13" font-weight="700" fill="#2a2a2a" text-anchor="middle">庫存模組 (Stock)</text>
      <text x="90" y="159" font-size="11" fill="#6b6b6b" text-anchor="middle">獨立資料隔離</text>
      <text x="90" y="179" font-size="11" font-weight="700" fill="#c13b3b" text-anchor="middle">進程內介面呼叫</text>
      <text x="90" y="197" font-size="10" fill="#2a2a2a" text-anchor="middle">零跨網路延遲</text>

      <!-- Module 4: Notify -->
      <rect x="200" y="112" width="180" height="98" rx="6" fill="#f8f9fa" stroke="#c13b3b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="290" y="138" font-size="13" font-weight="700" fill="#2a2a2a" text-anchor="middle">通知模組 (Notify)</text>
      <text x="290" y="159" font-size="11" fill="#6b6b6b" text-anchor="middle">獨立 Event Handler</text>
      <text x="290" y="179" font-size="11" font-weight="700" fill="#c13b3b" text-anchor="middle">公開 INotifyService</text>
      <text x="290" y="197" font-size="10" fill="#2a2a2a" text-anchor="middle">未來隨時可抽出</text>
    </g>

    <!-- Downward connection arrow -->
    <line x1="1320" y1="445" x2="1320" y2="500" stroke="#2a2a2a" stroke-width="2.5"/>
    <polygon points="1314,490 1320,502 1326,490" fill="#2a2a2a"/>

    <!-- Schema-Partitioned DB Cylinder (Center at 1320, width 220, height 95) -->
    <g transform="translate(1210, 505)">
      <!-- Cylinder Body -->
      <path d="M 0,16 L 0,80 A 110,16 0 0,0 220,80 L 220,16 A 110,16 0 0,1 0,16 Z" fill="#ffffff" stroke="#4a4a4a" stroke-width="2.5"/>
      <!-- Disk Ridges -->
      <path d="M 0,38 A 110,16 0 0,0 220,38" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="3,2"/>
      <path d="M 0,59 A 110,16 0 0,0 220,59" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="3,2"/>
      <!-- Internal Schema Partition Divisions -->
      <line x1="55" y1="36" x2="55" y2="76" stroke="#c13b3b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="110" y1="38" x2="110" y2="80" stroke="#c13b3b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <line x1="165" y1="36" x2="165" y2="76" stroke="#c13b3b" stroke-width="1.5" stroke-dasharray="2,2"/>
      <!-- Top Cap Ellipse -->
      <ellipse cx="110" cy="16" rx="110" ry="16" fill="#e8eaed" stroke="#4a4a4a" stroke-width="2.5"/>
      <text x="110" y="52" font-size="14.5" font-weight="800" fill="#2a2a2a" text-anchor="middle">邏輯隔離資料庫</text>
    </g>

    <!-- Labels below DB -->
    <text x="1320" y="630" font-size="15" font-weight="700" fill="#2a2a2a" text-anchor="middle">Schema 邏輯隔離資料庫</text>
