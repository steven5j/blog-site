<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" role="img" aria-label="三大架構拓撲核心對照：傳統單體 vs 微型服務 vs 模組化單體">
  <!-- Background -->
  <rect width="1600" height="680" fill="#f8f9fa" rx="12" stroke="#e5e5e5" stroke-width="1.5"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">
    <!-- Header title inside graphic -->
    <text x="800" y="44" font-size="24" font-weight="800" fill="#2a2a2a" text-anchor="middle" letter-spacing="0.04em">三大後端架構拓撲對比：傳統單體 vs 微型服務 vs 模組化單體</text>
    <text x="800" y="72" font-size="14" fill="#666666" text-anchor="middle">部署邊界、進程通訊模式、程式碼模組相依性與資料庫儲存策略的三維全景對照</text>

    <!-- ==================== COLUMN 1: 傳統單體架構 (MONOLITH) ==================== -->
    <g transform="translate(60, 105)">
      <!-- Outer Card -->
      <rect width="460" height="535" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <!-- Header Bar -->
      <path d="M 0 10 Q 0 0 10 0 L 450 0 Q 460 0 460 10 L 460 46 L 0 46 Z" fill="#2a2a2a"/>
      <text x="230" y="28" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1. 傳統單體架構 (Monolith)</text>

      <!-- Client Layer -->
      <rect x="25" y="60" width="410" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="230" y="82" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">前端客戶端 (Web / Mobile App)</text>

      <path d="M 230 94 L 230 115" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-dark)"/>

      <!-- Monolith Process Box -->
      <g transform="translate(25, 120)">
        <rect width="410" height="215" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
        <rect width="410" height="26" rx="8" fill="#c13b3b"/>
        <rect y="18" width="410" height="8" fill="#c13b3b"/>
        <text x="205" y="18" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">單一進程應用程式 (Single App Process / DLL / WAR)</text>

        <!-- Coupled modules intertwined -->
        <g transform="translate(20, 38)">
          <!-- Module Auth -->
          <rect x="0" y="0" width="115" height="48" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
          <text x="57" y="22" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">會員模組</text>
          <text x="57" y="38" font-size="9.5" fill="#666666" text-anchor="middle">Auth / User</text>

          <!-- Module Order -->
          <rect x="128" y="0" width="115" height="48" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
          <text x="185" y="22" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">訂單模組</text>
          <text x="185" y="38" font-size="9.5" fill="#666666" text-anchor="middle">Orders / Billing</text>

          <!-- Module Stock -->
          <rect x="255" y="0" width="115" height="48" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
          <text x="312" y="22" font-size="11.5" font-weight="700" fill="#991b1b" text-anchor="middle">庫存模組</text>
          <text x="312" y="38" font-size="9.5" fill="#666666" text-anchor="middle">Inventory</text>

          <!-- Intertwined call lines (Spaghetti) -->
          <path d="M 57 48 L 57 75 L 185 75 L 185 48" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
          <path d="M 185 48 L 185 95 L 312 95 L 312 48" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
          <path d="M 115 24 L 128 24" fill="none" stroke="#dc2626" stroke-width="1.5"/>

          <rect x="0" y="115" width="370" height="48" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
          <text x="185" y="134" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">共用記憶體 · 互相直接物件實例化或靜態呼叫</text>
          <text x="185" y="151" font-size="10" fill="#7f1d1d" text-anchor="middle">隨業務膨脹易失去邊界，退化為「巨石大泥球」</text>
        </g>
      </g>

      <!-- Arrow down to DB -->
      <path d="M 230 335 L 230 365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow-dark)"/>

      <!-- Single Database Instance with Raw JOINs -->
      <g transform="translate(45, 370)">
        <rect width="370" height="70" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
        <text x="185" y="24" font-size="12.5" font-weight="800" fill="#1e293b" text-anchor="middle">單一關聯式資料庫 (Single Database)</text>
        <line x1="20" y1="33" x2="350" y2="33" stroke="#e2e8f0" stroke-width="1"/>
        <text x="185" y="49" font-size="11" fill="#475569" text-anchor="middle">共用單一連線池 · 任意跨表 SQL JOIN (無邏輯防護)</text>
        <text x="185" y="63" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">優點：支援原生 ACID 強一致性本地事務</text>
      </g>

      <!-- Characteristics Summary -->
      <g transform="translate(25, 455)">
        <rect width="410" height="65" rx="6" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
        <text x="15" y="20" font-size="11" font-weight="700" fill="#b91c1c">架構特性總結：</text>
        <text x="15" y="38" font-size="10.5" fill="#475569">· 部署極速（全有或全無），本地開發除錯體驗極佳</text>
        <text x="15" y="55" font-size="10.5" fill="#dc2626">· 痛點：隨團隊規模膨脹，衝突劇烈且故障半徑為全站</text>
      </g>
    </g>

    <!-- ==================== COLUMN 2: 微型服務架構 (MICROSERVICES) ==================== -->
    <g transform="translate(570, 105)">
      <!-- Outer Card -->
      <rect width="460" height="535" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
      <!-- Header Bar -->
      <path d="M 0 10 Q 0 0 10 0 L 450 0 Q 460 0 460 10 L 460 46 L 0 46 Z" fill="#059669"/>
      <text x="230" y="28" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2. 微型服務架構 (Microservices)</text>

      <!-- API Gateway -->
      <rect x="25" y="60" width="410" height="34" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
      <text x="230" y="82" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">API Gateway (路由轉發 / 統一認證 / 速率限制)</text>

      <!-- Network arrow -->
      <path d="M 230 94 L 230 115" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Independent Pods / Microservices -->
      <g transform="translate(25, 120)">
        <rect width="410" height="215" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <rect width="410" height="26" rx="8" fill="#166534"/>
        <rect y="18" width="410" height="8" fill="#166534"/>
        <text x="205" y="18" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">服務物理自治 · 獨立容器 / 叢集 (K8s Pods / CI/CD)</text>

        <!-- 3 Pods -->
        <g transform="translate(15, 38)">
          <!-- Pod 1 -->
          <rect x="0" y="0" width="118" height="65" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
          <text x="59" y="20" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">會員服務</text>
          <text x="59" y="35" font-size="9" fill="#666666" text-anchor="middle">Auth Pod (8081)</text>
          <rect x="15" y="44" width="88" height="15" rx="3" fill="#ecfdf5"/>
          <text x="59" y="55" font-size="8.5" fill="#059669" text-anchor="middle">獨立 CI/CD 部署</text>

          <!-- Pod 2 -->
          <rect x="131" y="0" width="118" height="65" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
          <text x="190" y="20" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">訂單服務</text>
          <text x="190" y="35" font-size="9" fill="#666666" text-anchor="middle">Order Pod (8082)</text>
          <rect x="146" y="44" width="88" height="15" rx="3" fill="#ecfdf5"/>
          <text x="190" y="55" font-size="8.5" fill="#059669" text-anchor="middle">獨立 CI/CD 部署</text>

          <!-- Pod 3 -->
          <rect x="262" y="0" width="118" height="65" rx="5" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
          <text x="321" y="20" font-size="11.5" font-weight="700" fill="#065f46" text-anchor="middle">庫存服務</text>
          <text x="321" y="35" font-size="9" fill="#666666" text-anchor="middle">Stock Pod (8083)</text>
          <rect x="277" y="44" width="88" height="15" rx="3" fill="#ecfdf5"/>
          <text x="321" y="55" font-size="8.5" fill="#059669" text-anchor="middle">獨立 CI/CD 部署</text>

          <!-- Inter-service RPC/Queue -->
          <path d="M 118 30 L 131 30" fill="none" stroke="#059669" stroke-width="2"/>
          <path d="M 249 30 L 262 30" fill="none" stroke="#059669" stroke-width="2"/>

          <!-- Communication bus box -->
          <rect x="0" y="115" width="380" height="48" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
          <text x="190" y="134" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">跨網路 gRPC / HTTP 呼叫 + 訊息隊列 (Event Bus)</text>
          <text x="190" y="151" font-size="10" fill="#475569" text-anchor="middle">毫秒級網路延遲 · 需處理超時、斷路器與 Saga 補償</text>
        </g>
      </g>

      <!-- Arrow down to DBs -->
      <path d="M 230 335 L 230 365" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

      <!-- Database per Service -->
      <g transform="translate(40, 370)">
        <!-- DB 1 -->
        <rect x="0" y="0" width="118" height="70" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
        <text x="59" y="24" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">會員專屬 DB</text>
        <line x1="10" y1="33" x2="108" y2="33" stroke="#e2e8f0" stroke-width="1"/>
        <text x="59" y="50" font-size="9.5" fill="#666666" text-anchor="middle">僅 Auth 存取</text>
        <text x="59" y="63" font-size="8.5" fill="#dc2626" text-anchor="middle">嚴禁跨庫直查</text>

        <!-- DB 2 -->
        <rect x="131" y="0" width="118" height="70" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
        <text x="190" y="24" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">訂單專屬 DB</text>
        <line x1="141" y1="33" x2="239" y2="33" stroke="#e2e8f0" stroke-width="1"/>
        <text x="190" y="50" font-size="9.5" fill="#666666" text-anchor="middle">僅 Order 存取</text>
        <text x="190" y="63" font-size="8.5" fill="#dc2626" text-anchor="middle">無跨庫 JOIN</text>

        <!-- DB 3 -->
        <rect x="262" y="0" width="118" height="70" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
        <text x="321" y="24" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">庫存專屬 DB</text>
        <line x1="272" y1="33" x2="370" y2="33" stroke="#e2e8f0" stroke-width="1"/>
        <text x="321" y="50" font-size="9.5" fill="#666666" text-anchor="middle">僅 Stock 存取</text>
        <text x="321" y="63" font-size="8.5" fill="#059669" text-anchor="middle">最終一致性</text>
      </g>

      <!-- Characteristics Summary -->
      <g transform="translate(25, 455)">
        <rect width="410" height="65" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="15" y="20" font-size="11" font-weight="700" fill="#047857">架構特性總結：</text>
        <text x="15" y="38" font-size="10.5" fill="#475569">· 契合大型多團隊康威定律，可針對單一 Pod 精準擴展</text>
        <text x="15" y="55" font-size="10.5" fill="#b91c1c">· 代價：分散式交易補償極昂貴，需高門檻 K8s 維運</text>
      </g>
    </g>

    <!-- ==================== COLUMN 3: 模組化單體 (MODULAR MONOLITH) ==================== -->
    <g transform="translate(1080, 105)">
      <!-- Outer Card -->
      <rect width="460" height="535" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
      <!-- Header Bar -->
      <path d="M 0 10 Q 0 0 10 0 L 450 0 Q 460 0 460 10 L 460 46 L 0 46 Z" fill="#7c3aed"/>
      <text x="230" y="28" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3. 模組化單體 (Modular Monolith)</text>

      <!-- Client Layer -->
      <rect x="25" y="60" width="410" height="34" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
      <text x="230" y="82" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">前端客戶端 (Web / Mobile App / API)</text>

      <path d="M 230 94 L 230 115" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

      <!-- Modular Monolith Process Box -->
      <g transform="translate(25, 120)">
        <rect width="410" height="215" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
        <rect width="410" height="26" rx="8" fill="#6d28d9"/>
        <rect y="18" width="410" height="8" fill="#6d28d9"/>
        <text x="205" y="18" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">單一進程 · 程式碼層級嚴格依賴倒置 (Clean Architecture)</text>

        <!-- 3 Modules with public contracts -->
        <g transform="translate(15, 38)">
          <!-- Module 1 -->
          <rect x="0" y="0" width="118" height="65" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
          <text x="59" y="18" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">會員模組</text>
          <rect x="8" y="24" width="102" height="17" rx="3" fill="#ede9fe"/>
          <text x="59" y="36" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">公開: IAuthModule</text>
          <text x="59" y="55" font-size="8.5" fill="#64748b" text-anchor="middle">內部實作封裝</text>

          <!-- Module 2 -->
          <rect x="131" y="0" width="118" height="65" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
          <text x="190" y="18" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">訂單模組</text>
          <rect x="139" y="24" width="102" height="17" rx="3" fill="#ede9fe"/>
          <text x="190" y="36" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">公開: IOrderModule</text>
          <text x="190" y="55" font-size="8.5" fill="#64748b" text-anchor="middle">內部實作封裝</text>

          <!-- Module 3 -->
          <rect x="262" y="0" width="118" height="65" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
          <text x="321" y="18" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">庫存模組</text>
          <rect x="270" y="24" width="102" height="17" rx="3" fill="#ede9fe"/>
          <text x="321" y="36" font-size="9" font-weight="700" fill="#6d28d9" text-anchor="middle">公開: IStockModule</text>
          <text x="321" y="55" font-size="8.5" fill="#64748b" text-anchor="middle">內部實作封裝</text>

          <!-- Interface Arrows (In process) -->
          <path d="M 118 32 L 131 32" fill="none" stroke="#7c3aed" stroke-width="2"/>
          <path d="M 249 32 L 262 32" fill="none" stroke="#7c3aed" stroke-width="2"/>

          <!-- In-process communication box -->
          <rect x="0" y="115" width="380" height="48" rx="5" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/>
          <text x="190" y="134" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">記憶體內介面指針調用 (奈秒級 ns) · 零網路序列化開銷</text>
          <text x="190" y="151" font-size="10" fill="#475569" text-anchor="middle">禁止跨模組直接存取內部 Entity；支援本地 MediatR 事件</text>
        </g>
      </g>

      <!-- Arrow down to DB -->
      <path d="M 230 335 L 230 365" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

      <!-- Single Database with Schema Isolation -->
      <g transform="translate(45, 370)">
        <rect width="370" height="70" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="185" y="22" font-size="12" font-weight="800" fill="#1e293b" text-anchor="middle">單一資料庫實例 · 邏輯 Schema 嚴格隔離</text>
        <line x1="20" y1="30" x2="350" y2="30" stroke="#e2e8f0" stroke-width="1"/>

        <!-- 3 Schemas -->
        <g transform="translate(15, 36)">
          <rect x="0" y="0" width="105" height="26" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
          <text x="52" y="17" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">auth_schema.*</text>

          <rect x="117" y="0" width="105" height="26" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
          <text x="170" y="17" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">order_schema.*</text>

          <rect x="235" y="0" width="105" height="26" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
          <text x="287" y="17" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">stock_schema.*</text>
        </g>
      </g>

      <!-- Characteristics Summary -->
      <g transform="translate(25, 455)">
        <rect width="410" height="65" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
        <text x="15" y="20" font-size="11" font-weight="700" fill="#6d28d9">架構特性總結：</text>
        <text x="15" y="38" font-size="10.5" fill="#475569">· 兼具單體極低維運成本與微服務的清晰業務邊界</text>
        <text x="15" y="55" font-size="10.5" font-weight="700" fill="#059669">· 未來特定模組遭遇瓶頸時，可在數天內無痛抽成獨立微服務</text>
      </g>
    </g>

    <!-- Marker Definitions -->
    <defs>
      <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
      </marker>
      <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
      </marker>
      <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 8 5 L 0 9 z" fill="#7c3aed"/>
      </marker>
    </defs>
  </g>
</svg>
